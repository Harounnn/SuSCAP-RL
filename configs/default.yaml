seed: 42
device: cuda

env:
  obs_dim: 5
  action_dim: 1
  n_constraints: 2

conditioning:
  preference_dim: 3
  scenario_dim: 5
  cond_dim: 8

training:
  total_steps: 60000
  batch_size: 256
  updates_per_step: 2
  episode_length: 180
  gamma: 0.99
  tau: 0.005
  scalar_mode: "linear"
  chebyshev_start: 15000

model:
  hidden_sizes: [128, 128]
  ensemble_size: 2
  entropy_coef: 0.05
  actor_lr: 0.0001
  critic_lr: 0.0003

constraints:
  dual_lr: 0.02
  dual_update_freq: 50
  lambda_max: 50.0
  lambda_init: [0.01, 0.01]
  cost_thresholds: [0.000006, 0.05]

curriculum:
  phase_schedule:
    - corners
    - edges
    - grid
    - adversarial
    - refinement
    - polishing
  phase_steps:
    corners: 7500
    edges: 12000
    grid: 18000
    adversarial: 7500
    refinement: 9000
    polishing: 6000

evaluation:
  eval_freq: 50000
  eval_episode_length: 180
  eval_episodes: 2
  eval_n_preferences: 3
  preference_grid: coarse
  hv_samples: 500
